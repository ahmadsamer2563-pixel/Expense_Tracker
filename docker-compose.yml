services:
  database:
    image: postgres:16
    container_name: database

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - database

